# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: false
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: billing
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths:
    - /api/v1/plans/create
    - /api/v1/plans/update
    - /api/v1/plans/usage-prices/upsert
    - /api/v1/plans/usage-prices/delete
    - /api/v1/subscriptions/create
    - /api/v1/subscriptions/change
    - /api/v1/subscriptions/cancel
    - /api/v1/invoices/generate
    - /api/v1/invoices/finalize
    - /api/v1/invoices/void
    - /api/v1/payments/create-attempt
    - /api/v1/payments/apply-result
    - /api/v1/payments/refunds/record
  grpc_methods:
    - /platform.billing.v1.BillingService/CreatePlan
    - /platform.billing.v1.BillingService/UpdatePlan
    - /platform.billing.v1.BillingService/UpsertUsagePrice
    - /platform.billing.v1.BillingService/DeleteUsagePrice
    - /platform.billing.v1.BillingService/CreateSubscription
    - /platform.billing.v1.BillingService/ChangeSubscription
    - /platform.billing.v1.BillingService/CancelSubscription
    - /platform.billing.v1.BillingService/GenerateInvoice
    - /platform.billing.v1.BillingService/FinalizeInvoice
    - /platform.billing.v1.BillingService/VoidInvoice
    - /platform.billing.v1.BillingService/CreatePaymentAttempt
    - /platform.billing.v1.BillingService/ApplyPaymentResult
    - /platform.billing.v1.BillingService/RecordRefund
    - /platform.billing.v1.BillingService/ReconcilePayment
observability:
  metrics_enabled: true
  tracing_enabled: false
service_registry:
  enabled: true
  target: service-registry-service.platform.svc.cluster.local:9090
  endpoint: grpcs://billing-service.platform.svc.cluster.local:9090
  tls: {enabled: true, server_name: service-registry-service.platform.svc.cluster.local}
outbound:
  http:
    payment_gateway:
      base_url: https://payment-gateway.platform-production.svc/
      tls:
        enabled: true
        server_name: payment-gateway.platform-production.svc
  grpc:
    application:
      target: application-service:9090
      timeout: 2s
      auth: {type: "", token: ""}
      retry: {max_attempts: 2, initial_backoff: 100ms, max_backoff: 500ms, methods: [/platform.application.v1.ApplicationService/BatchCheckTenantApplications]}
      breaker: {enabled: true, failure_threshold: 5, open_timeout: 30s}
      tls: {enabled: true, server_name: application-service, ca_file: "", cert_file: "", key_file: ""}
    authorization:
      target: authorization-service:9090
      timeout: 2s
      auth: {type: "", token: ""}
      retry: {max_attempts: 2, initial_backoff: 100ms, max_backoff: 500ms, methods: [/platform.authorization.v1.AuthorizationService/Check]}
      breaker: {enabled: true, failure_threshold: 5, open_timeout: 30s}
      tls: {enabled: true, server_name: authorization-service, ca_file: "", cert_file: "", key_file: ""}
